plugins {
    id "multiloader-common"
    id "me.modmuss50.mod-publish-plugin" // https://github.com/modmuss50/mod-publish-plugin
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'/*, 'javadocElements'*/].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources{
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

publishMods {
    def isFabric = true
    def loaderName = "Fabric"
    def changelogFile = rootProject.file("changelog.md")

    type = STABLE

    file = project.tasks.jar.archiveFile
    changelog = changelogFile.text

    version = "$project.version+mc$minecraft_version"
    displayName = "$mod_name $loaderName $project.version for mc$minecraft_version"
    modLoaders.add(project.name)

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "1312371"
        projectSlug = "sable"
        minecraftVersions.add(minecraft_version)

        clientRequired = true
        serverRequired = true

        requires("fabric-api")
        embeds("forge-config-api-port")

        embeds("veil-lib")
        optional "imguimc"
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "T9PomCSv"
        minecraftVersions.add(minecraft_version)

        requires("fabric-api")
        embeds("forge-config-api-port")

        embeds("veil")
        optional "imguimc"
    }

    github {
        repository = "ryanhcode/sable"
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        tagName = "mc$minecraft_version-$project.version-$project.name"
        commitish = "main"

        file.unset()
        file.unsetConvention()

        allowEmptyFiles = true
    }

}