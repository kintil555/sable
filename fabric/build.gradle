plugins {
    id 'me.modmuss50.mod-publish-plugin'
    id 'net.fabricmc.fabric-loom'
    id 'multiloader-loader'
}

evaluationDependsOn(":sable_rapier")

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Minecraft 26.x is unobfuscated: mods are plain dependencies, no mappings, no remapping.
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    include(implementation("org.apache.maven:maven-artifact:3.8.5"))


    // Physics pipeline (Rapier natives), nested into the final jar
    include(implementation(project(":sable_rapier")))

    include(implementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}")) //source: https://github.com/Fuzss/forgeconfigapiport-fabric
}

loom {
    def aw = project(":common").file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        def client = client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        def server = server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }

        clientMixinExport {
            inherit(client)
            setConfigName(configName + " | Mixin Export")
            vmArg("-Dmixin.debug.export=true")
            runDir("runs/client")
        }
        serverMixinExport {
            inherit(server)
            setConfigName(configName + " | Mixin Export")
            vmArg("-Dmixin.debug.export=true")
            runDir("runs/server")
        }
    }
}
